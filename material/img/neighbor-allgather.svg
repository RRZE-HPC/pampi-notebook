<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" width="780" height="360" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97a1e"/></marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a3a29c"/></marker>
    <marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a5cc2"/></marker>
    <pattern id="pad" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fcfcfb"/><line x1="0" y1="0" x2="0" y2="6" stroke="#e4e3df" stroke-width="3"/></pattern>
  </defs>
  <rect width="780" height="360" rx="12" fill="#fcfcfb"/>
  <text x="40" y="32" font-size="13.5" fill="#0b0b0b" font-weight="bold" font-family="Menlo, Consolas, monospace">MPI_Neighbor_allgather</text>
  <text x="236" y="32" font-size="12.5" fill="#52514e">every rank sends the same block to all its neighbors</text>
  <rect x="148.0" y="145.0" width="84" height="50" rx="4" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="2.2"/>
  <text x="190" y="162" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="bold">rank 8 (me)</text>
  <rect x="175.0" y="171" width="30" height="18" rx="3" fill="#f1f0ee" stroke="#52514e" stroke-width="1.2"/>
  <text x="190" y="184" font-size="11" fill="#0b0b0b" text-anchor="middle" font-family="Menlo, Consolas, monospace">8</text>
  <rect x="28.0" y="145.0" width="84" height="50" rx="4" fill="#e3edfa" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="70" y="162" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="bold">rank 5</text>
  <rect x="55.0" y="171" width="30" height="18" rx="3" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.2"/>
  <text x="70" y="184" font-size="11" fill="#0b0b0b" text-anchor="middle" font-family="Menlo, Consolas, monospace">5</text>
  <line x1="114.0" y1="170.0" x2="146.0" y2="170.0" stroke="#2a78d6" stroke-width="1.8" marker-end="url(#arrb)"/>
  <rect x="268.0" y="145.0" width="84" height="50" rx="4" fill="#e3edfa" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="310" y="162" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="bold">rank 11</text>
  <rect x="295.0" y="171" width="30" height="18" rx="3" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.2"/>
  <text x="310" y="184" font-size="11" fill="#0b0b0b" text-anchor="middle" font-family="Menlo, Consolas, monospace">11</text>
  <line x1="266.0" y1="170.0" x2="234.0" y2="170.0" stroke="#2a78d6" stroke-width="1.8" marker-end="url(#arrb)"/>
  <rect x="148.0" y="229.0" width="84" height="50" rx="4" fill="#fbe9d6" stroke="#d97a1e" stroke-width="1.5"/>
  <text x="190" y="246" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="bold">rank 7</text>
  <rect x="175.0" y="255" width="30" height="18" rx="3" fill="#fcfcfb" stroke="#d97a1e" stroke-width="1.2"/>
  <text x="190" y="268" font-size="11" fill="#0b0b0b" text-anchor="middle" font-family="Menlo, Consolas, monospace">7</text>
  <line x1="190.0" y1="227.0" x2="190.0" y2="197.0" stroke="#d97a1e" stroke-width="1.8" marker-end="url(#arro)"/>
  <rect x="130" y="73" width="120" height="26" rx="13" fill="#fcfcfb" stroke="#a3a29c" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="190" y="90" font-size="11" fill="#52514e" text-anchor="middle" font-family="Menlo, Consolas, monospace">MPI_PROC_NULL</text>
  <line x1="190" y1="101" x2="190.0" y2="143.0" stroke="#a3a29c" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrg)"/>
  <text x="40" y="60" font-size="11" fill="#52514e">rank 8 = (2,2) of the 4 × 3 grid, periodic in dim 0</text>
  <text x="410" y="120" font-size="12.5" fill="#0b0b0b" font-weight="bold">recvbuf of rank 8</text>
  <rect x="410" y="130" width="78" height="34" rx="3" fill="#e3edfa" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="449.0" y="152.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="bold">5</text>
  <text x="449.0" y="179" font-size="10.5" fill="#52514e" text-anchor="middle">0: dim 0 −</text>
  <rect x="492" y="130" width="78" height="34" rx="3" fill="#e3edfa" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="531.0" y="152.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="bold">11</text>
  <text x="531.0" y="179" font-size="10.5" fill="#52514e" text-anchor="middle">1: dim 0 +</text>
  <rect x="574" y="130" width="78" height="34" rx="3" fill="#fbe9d6" stroke="#d97a1e" stroke-width="1.5"/>
  <text x="613.0" y="152.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="bold">7</text>
  <text x="613.0" y="179" font-size="10.5" fill="#52514e" text-anchor="middle">2: dim 1 −</text>
  <rect x="656" y="130" width="78" height="34" rx="3" fill="url(#pad)" stroke="#a3a29c" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text x="695.0" y="151.0" font-size="11" fill="#52514e" text-anchor="middle" font-family="Menlo, Consolas, monospace">−1</text>
  <text x="695.0" y="179" font-size="10.5" fill="#52514e" text-anchor="middle">3: dim 1 +</text>
  <text x="410" y="210" font-size="11.5" fill="#52514e">slot i holds the block from neighbor i;</text>
  <text x="410" y="226" font-size="11.5" fill="#52514e">slot 3: the top neighbor is MPI_PROC_NULL,</text>
  <text x="410" y="242" font-size="11.5" fill="#52514e">so the slot is not touched (−1 from the code)</text>
  <line x1="40" y1="290" x2="740" y2="290" stroke="#e4e3df" stroke-width="1"/>
  <text x="40" y="314" font-size="12" fill="#0b0b0b">At the same time, rank 8 sends its own 8 to ranks 5, 11 and 7 — there it lands in slot 1, 0 and 3:</text>
  <text x="40" y="332" font-size="12" fill="#0b0b0b">a block is stored under the direction it came from. Unlike MPI_Allgather, recvbuf has 2 · ndims blocks, not size.</text>
</svg>
