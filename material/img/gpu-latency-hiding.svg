  <rect x="679" y="40" width="142" height="16" rx="2" fill="url(#stall)" stroke="#c8373a" stroke-width="1"/>
  <text x="20" y="78" font-size="11" fill="#52514e">thread 1 (SMT)</text>
  <rect x="263" y="66" width="90" height="16" rx="2" fill="#ece3f7" stroke="#8a5cc2" stroke-width="1"/>
  <rect x="393" y="66" width="64" height="16" rx="2" fill="#ece3f7" stroke="#8a5cc2" stroke-width="1"/>
  <rect x="679" y="66" width="90" height="16" rx="2" fill="#ece3f7" stroke="#8a5cc2" stroke-width="1"/>
  <text x="120" y="104" font-size="10.5" fill="#52514e">independent instructions of the same thread fill the wait (ILP, several misses in flight);</text>
  <text x="120" y="118" font-size="10.5" fill="#52514e">a second hardware thread fills part of the rest. Prefetchers and caches avoid many misses altogether.</text>
