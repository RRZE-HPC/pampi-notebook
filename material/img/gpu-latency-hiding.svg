  <rect x="185" y="45" width="311" height="6" rx="2" fill="#dcf0e3" stroke="#2f9a5b" stroke-width="0.8"/>
  <text x="189" y="37" font-size="10" fill="#2f9a5b">load misses the caches: ~100 ns = 300+ cycles</text>
  <rect x="185" y="40" width="77" height="16" rx="2" fill="#e3edfa" stroke="#2a78d6" stroke-width="1"/>
  <rect x="263" y="40" width="233" height="16" rx="2" fill="url(#stall)" stroke="#c8373a" stroke-width="1"/>
  <text x="380" y="52" font-size="10" fill="#c8373a" text-anchor="middle">stall: reorder buffer full</text>
  <rect x="497" y="40" width="103" height="16" rx="2" fill="#e3edfa" stroke="#2a78d6" stroke-width="1"/>
  <rect x="601" y="40" width="12" height="16" rx="2" fill="#2f9a5b" stroke="#2f9a5b" stroke-width="1"/>
