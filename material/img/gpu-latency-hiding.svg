<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 410" width="860" height="410" font-family="Helvetica, Arial, sans-serif">
  <title>Latency hiding: a CPU core overlaps a cache miss with the independent instructions of the same thread until its reorder buffer is full and then stalls, SMT adds a second thread; a GPU warp scheduler switches every cycle to another ready warp, so with enough warps the issue slot is never idle</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
    <pattern id="stall" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#f7dcdc"/><line x1="0" y1="0" x2="0" y2="6" stroke="#c8373a" stroke-width="1.2" stroke-opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="860" height="410" rx="12" fill="#fcfcfb"/>
  <text x="20" y="26" font-size="13" fill="#0b0b0b" font-weight="bold">CPU core: out-of-order execution (+ SMT)</text>
  <text x="20" y="52" font-size="11" fill="#52514e">thread 0</text>
  <rect x="120" y="40" width="51" height="16" rx="2" fill="#e3edfa" stroke="#2a78d6" stroke-width="1"/>
