  <text x="820" y="380" font-size="10.5" fill="#52514e" text-anchor="end">time (cycles)</text>
  <text x="120" y="380" font-size="10.5" fill="#52514e">every warp waits for memory most of the time, but in every cycle some warp is ready;</text>
  <text x="120" y="394" font-size="10.5" fill="#52514e">switching is free: the registers of all resident warps stay in the register file. With fewer warps, slots stay empty.</text>
