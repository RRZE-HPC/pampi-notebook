<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/>
    </marker>
  </defs>
  <rect width="760" height="360" rx="12" fill="#fcfcfb"/>

  <rect x="30" y="20" width="700" height="44" rx="8" fill="#f1f0ee" stroke="#a3a29c" stroke-width="1.5"/>
  <text x="380" y="40" text-anchor="middle" font-size="16" font-weight="bold" fill="#0b0b0b">program startup</text>
  <text x="380" y="57" text-anchor="middle" font-size="13" fill="#52514e">mpirun / srun launches the processes and creates MPI_COMM_WORLD</text>

  <g stroke="#a3a29c" stroke-width="2">
    <line x1="140" y1="64" x2="140" y2="296"/>
    <line x1="300" y1="64" x2="300" y2="296"/>
    <line x1="460" y1="64" x2="460" y2="296"/>
    <line x1="620" y1="64" x2="620" y2="296"/>
  </g>
  <g font-size="14" text-anchor="middle" fill="#0b0b0b">
    <rect x="100" y="80" width="80" height="28" rx="6" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="1.5"/><text x="140" y="99">rank 0</text>
    <rect x="260" y="80" width="80" height="28" rx="6" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="1.5"/><text x="300" y="99">rank 1</text>
    <rect x="420" y="80" width="80" height="28" rx="6" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="1.5"/><text x="460" y="99">rank 2</text>
    <rect x="580" y="80" width="80" height="28" rx="6" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="1.5"/><text x="620" y="99">rank 3</text>
  </g>

  <line x1="146" y1="148" x2="294" y2="148" stroke="#2a78d6" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="220" y="140" text-anchor="middle" font-size="13" fill="#0b0b0b">point-to-point</text>
  <line x1="614" y1="168" x2="466" y2="168" stroke="#2a78d6" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="540" y="160" text-anchor="middle" font-size="13" fill="#0b0b0b">point-to-point</text>

  <rect x="110" y="200" width="540" height="40" rx="8" fill="#e3edfa" stroke="#2a78d6" stroke-width="2"/>
  <text x="380" y="225" text-anchor="middle" font-size="14" fill="#0b0b0b">collective: barrier, reductions, scatter/gather, …</text>

  <rect x="30" y="296" width="700" height="44" rx="8" fill="#f1f0ee" stroke="#a3a29c" stroke-width="1.5"/>
  <text x="380" y="316" text-anchor="middle" font-size="16" font-weight="bold" fill="#0b0b0b">program shutdown</text>
  <text x="380" y="333" text-anchor="middle" font-size="13" fill="#52514e">MPI_Finalize()</text>
</svg>
