<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 250" width="780" height="250" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
    <pattern id="pad" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#fcfcfb"/><line x1="0" y1="0" x2="0" y2="6" stroke="#e4e3df" stroke-width="3"/>
    </pattern>
  </defs>
  <rect width="780" height="250" rx="12" fill="#fcfcfb"/>
  <text x="30" y="84" font-size="13" fill="#0b0b0b" font-weight="bold">process 0</text>
  <text x="120" y="64" font-size="12" fill="#52514e">thread 0</text>
  <line x1="185" y1="60" x2="520" y2="60" stroke="#a3a29c" stroke-width="1.5"/>
  <text x="120" y="104" font-size="12" fill="#52514e">thread 1</text>
  <line x1="185" y1="100" x2="520" y2="100" stroke="#a3a29c" stroke-width="1.5"/>
  <text x="30" y="184" font-size="13" fill="#0b0b0b" font-weight="bold">process 1</text>
  <text x="120" y="164" font-size="12" fill="#52514e">thread 0</text>
  <line x1="185" y1="160" x2="520" y2="160" stroke="#a3a29c" stroke-width="1.5"/>
  <text x="120" y="204" font-size="12" fill="#52514e">thread 1</text>
  <line x1="185" y1="200" x2="520" y2="200" stroke="#a3a29c" stroke-width="1.5"/>
  <line x1="185" y1="228" x2="520" y2="228" stroke="#52514e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="525" y="232" font-size="11" fill="#52514e">time</text>
  <rect x="208" y="47" width="104" height="26" rx="4" fill="#e3edfa" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="260" y="65" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-family="Menlo, Consolas, monospace">MPI_Bcast</text>
  <rect x="368" y="87" width="104" height="26" rx="4" fill="#dcf0e3" stroke="#2f9a5b" stroke-width="1.5"/>
  <text x="420" y="105" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-family="Menlo, Consolas, monospace">MPI_Barrier</text>
  <rect x="208" y="187" width="104" height="26" rx="4" fill="#dcf0e3" stroke="#2f9a5b" stroke-width="1.5"/>
  <text x="260" y="205" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-family="Menlo, Consolas, monospace">MPI_Barrier</text>
  <rect x="368" y="147" width="104" height="26" rx="4" fill="#e3edfa" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="420" y="165" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-family="Menlo, Consolas, monospace">MPI_Bcast</text>
  <line x1="260" y1="74" x2="260" y2="186" stroke="#c8373a" stroke-width="2" stroke-dasharray="5 3"/>
  <line x1="420" y1="114" x2="420" y2="146" stroke="#c8373a" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="545" y="60" font-size="12.5" fill="#52514e">On one communicator, collectives are</text>
  <text x="545" y="79" font-size="12.5" fill="#52514e">matched in the order of the calls —</text>
  <text x="545" y="98" font-size="12.5" fill="#52514e">here MPI_Bcast with MPI_Barrier:</text>
  <text x="545" y="117" font-size="12.5" fill="#c8373a">erroneous.</text>
  <text x="545" y="136" font-size="12.5" fill="#52514e"></text>
  <text x="545" y="155" font-size="12.5" fill="#0b0b0b" font-weight="bold">Fix: one communicator per thread</text>
  <text x="545" y="174" font-size="12.5" fill="#0b0b0b">(MPI_Comm_dup), or synchronize the</text>
  <text x="545" y="193" font-size="12.5" fill="#0b0b0b">threads so that the order is the same.</text>
</svg>
