<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 250" width="780" height="250" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
    <pattern id="pad" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#fcfcfb"/><line x1="0" y1="0" x2="0" y2="6" stroke="#e4e3df" stroke-width="3"/>
    </pattern>
  </defs>
  <rect width="780" height="250" rx="12" fill="#fcfcfb"/>
  <rect x="143.0" y="93.0" width="54" height="54" rx="4" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="1.5"/>
  <text x="170" y="125" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="bold">me</text>
  <rect x="83.0" y="93.0" width="54" height="54" rx="4" fill="#e3edfa" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="110" y="122" font-size="17" fill="#0b0b0b" text-anchor="middle" font-weight="bold">0</text>
  <text x="110" y="138" font-size="10" fill="#52514e" text-anchor="middle">left</text>
  <rect x="203.0" y="93.0" width="54" height="54" rx="4" fill="#e3edfa" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="230" y="122" font-size="17" fill="#0b0b0b" text-anchor="middle" font-weight="bold">1</text>
  <text x="230" y="138" font-size="10" fill="#52514e" text-anchor="middle">right</text>
  <rect x="143.0" y="153.0" width="54" height="54" rx="4" fill="#fbe9d6" stroke="#d97a1e" stroke-width="1.5"/>
  <text x="170" y="182" font-size="17" fill="#0b0b0b" text-anchor="middle" font-weight="bold">2</text>
  <text x="170" y="198" font-size="10" fill="#52514e" text-anchor="middle">bottom</text>
  <rect x="143.0" y="33.0" width="54" height="54" rx="4" fill="#fbe9d6" stroke="#d97a1e" stroke-width="1.5"/>
  <text x="170" y="62" font-size="17" fill="#0b0b0b" text-anchor="middle" font-weight="bold">3</text>
  <text x="170" y="78" font-size="10" fill="#52514e" text-anchor="middle">top</text>
  <line x1="60" y1="230" x2="280" y2="230" stroke="#52514e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="286" y="234" font-size="12" fill="#52514e" font-family="Menlo, Consolas, monospace">dim 0</text>
  <line x1="60" y1="230" x2="60" y2="20" stroke="#52514e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="60" y="14" font-size="12" fill="#52514e" text-anchor="middle" font-family="Menlo, Consolas, monospace">dim 1</text>
  <text x="400" y="60" font-size="13" fill="#0b0b0b">recvbuf of MPI_Neighbor_allgather / _alltoall:</text>
  <rect x="400" y="74" width="80" height="34" rx="3" fill="#e3edfa" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="440" y="96" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="bold">0</text>
  <text x="440" y="126" font-size="11.5" fill="#52514e" text-anchor="middle">dim 0 −</text>
  <rect x="482" y="74" width="80" height="34" rx="3" fill="#e3edfa" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="522" y="96" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="bold">1</text>
  <text x="522" y="126" font-size="11.5" fill="#52514e" text-anchor="middle">dim 0 +</text>
  <rect x="564" y="74" width="80" height="34" rx="3" fill="#fbe9d6" stroke="#d97a1e" stroke-width="1.5"/>
  <text x="604" y="96" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="bold">2</text>
  <text x="604" y="126" font-size="11.5" fill="#52514e" text-anchor="middle">dim 1 −</text>
  <rect x="646" y="74" width="80" height="34" rx="3" fill="#fbe9d6" stroke="#d97a1e" stroke-width="1.5"/>
  <text x="686" y="96" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="bold">3</text>
  <text x="686" y="126" font-size="11.5" fill="#52514e" text-anchor="middle">dim 1 +</text>
  <text x="400" y="165" font-size="12.5" fill="#52514e">for each dimension: first the neighbor in</text>
  <text x="400" y="184" font-size="12.5" fill="#52514e">negative, then in positive direction —</text>
  <text x="400" y="203" font-size="12.5" fill="#52514e">the order of MPI_Cart_shift(cart, d, 1, &amp;src, &amp;dst):</text>
  <text x="400" y="222" font-size="12.5" fill="#52514e">src first, then dst</text>
</svg>
