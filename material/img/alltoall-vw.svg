<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 372" width="780" height="372" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
  </defs>
  <rect width="780" height="372" rx="12" fill="#fcfcfb"/>
  <text x="20" y="30" font-size="15" fill="#0b0b0b" font-weight="bold">How the sendbuf of one rank is cut into the chunks for ranks 0, 1, 2</text>
  <text x="20" y="90" font-size="13" fill="#0b0b0b" font-family="Menlo, Consolas, monospace" font-weight="bold">MPI_Alltoall</text>
  <rect x="150" y="70" width="34" height="30" rx="3" fill="#e3edfa" stroke="#2a78d6" stroke-width="1.5"/>
  <rect x="186" y="70" width="34" height="30" rx="3" fill="#e3edfa" stroke="#2a78d6" stroke-width="1.5"/>
  <rect x="222" y="70" width="34" height="30" rx="3" fill="#fbe9d6" stroke="#d97a1e" stroke-width="1.5"/>
  <rect x="258" y="70" width="34" height="30" rx="3" fill="#fbe9d6" stroke="#d97a1e" stroke-width="1.5"/>
  <rect x="294" y="70" width="34" height="30" rx="3" fill="#dcf0e3" stroke="#2f9a5b" stroke-width="1.5"/>
  <rect x="330" y="70" width="34" height="30" rx="3" fill="#dcf0e3" stroke="#2f9a5b" stroke-width="1.5"/>
  <path d="M152,103 v4 H218 v-4" fill="none" stroke="#52514e" stroke-width="1.2"/>
  <text x="185.0" y="120" font-size="11.5" fill="#52514e" text-anchor="middle">→ 0</text>
  <path d="M224,103 v4 H290 v-4" fill="none" stroke="#52514e" stroke-width="1.2"/>
  <text x="257.0" y="120" font-size="11.5" fill="#52514e" text-anchor="middle">→ 1</text>
  <path d="M296,103 v4 H362 v-4" fill="none" stroke="#52514e" stroke-width="1.2"/>
  <text x="329.0" y="120" font-size="11.5" fill="#52514e" text-anchor="middle">→ 2</text>
  <text x="460" y="82" font-size="12" fill="#52514e">one sendcount, one sendtype:</text>
  <text x="460" y="100" font-size="12" fill="#52514e">chunk j starts at element j·sendcount</text>
  <text x="460" y="118" font-size="11.5" fill="#52514e" font-family="Menlo, Consolas, monospace">sendcount = 2</text>
  <text x="20" y="190" font-size="13" fill="#0b0b0b" font-family="Menlo, Consolas, monospace" font-weight="bold">MPI_Alltoallv</text>
  <rect x="150" y="170" width="34" height="30" rx="3" fill="#e3edfa" stroke="#2a78d6" stroke-width="1.5"/>
  <rect x="186" y="170" width="34" height="30" rx="3" fill="#fbe9d6" stroke="#d97a1e" stroke-width="1.5"/>
  <rect x="222" y="170" width="34" height="30" rx="3" fill="#fbe9d6" stroke="#d97a1e" stroke-width="1.5"/>
  <rect x="258" y="170" width="34" height="30" rx="3" fill="#fbe9d6" stroke="#d97a1e" stroke-width="1.5"/>
  <rect x="294" y="170" width="34" height="30" rx="3" fill="none" stroke="#b9b8b4" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="330" y="170" width="34" height="30" rx="3" fill="none" stroke="#b9b8b4" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="366" y="170" width="34" height="30" rx="3" fill="#dcf0e3" stroke="#2f9a5b" stroke-width="1.5"/>
  <rect x="402" y="170" width="34" height="30" rx="3" fill="#dcf0e3" stroke="#2f9a5b" stroke-width="1.5"/>
  <path d="M152,203 v4 H182 v-4" fill="none" stroke="#52514e" stroke-width="1.2"/>
  <text x="167.0" y="220" font-size="11.5" fill="#52514e" text-anchor="middle">→ 0</text>
  <path d="M188,203 v4 H290 v-4" fill="none" stroke="#52514e" stroke-width="1.2"/>
  <text x="239.0" y="220" font-size="11.5" fill="#52514e" text-anchor="middle">→ 1</text>
  <path d="M368,203 v4 H434 v-4" fill="none" stroke="#52514e" stroke-width="1.2"/>
  <text x="401.0" y="220" font-size="11.5" fill="#52514e" text-anchor="middle">→ 2</text>
  <text x="167.0" y="164" font-size="10.5" fill="#52514e" text-anchor="middle" font-family="Menlo, Consolas, monospace">0</text>
  <text x="203.0" y="164" font-size="10.5" fill="#52514e" text-anchor="middle" font-family="Menlo, Consolas, monospace">1</text>
  <text x="239.0" y="164" font-size="10.5" fill="#52514e" text-anchor="middle" font-family="Menlo, Consolas, monospace">2</text>
  <text x="275.0" y="164" font-size="10.5" fill="#52514e" text-anchor="middle" font-family="Menlo, Consolas, monospace">3</text>
  <text x="311.0" y="164" font-size="10.5" fill="#52514e" text-anchor="middle" font-family="Menlo, Consolas, monospace">4</text>
  <text x="347.0" y="164" font-size="10.5" fill="#52514e" text-anchor="middle" font-family="Menlo, Consolas, monospace">5</text>
  <text x="383.0" y="164" font-size="10.5" fill="#52514e" text-anchor="middle" font-family="Menlo, Consolas, monospace">6</text>
  <text x="419.0" y="164" font-size="10.5" fill="#52514e" text-anchor="middle" font-family="Menlo, Consolas, monospace">7</text>
  <text x="460" y="182" font-size="12" fill="#52514e">one sendtype, per-rank counts and displacements</text>
  <text x="460" y="200" font-size="12" fill="#52514e">(displacements in units of sendtype):</text>
  <text x="460" y="218" font-size="11.5" fill="#52514e" font-family="Menlo, Consolas, monospace">sendcounts = {1, 3, 2}  sdispls = {0, 1, 6}</text>
  <text x="140" y="164" font-size="10.5" fill="#52514e" text-anchor="end">element</text>
  <text x="20" y="290" font-size="13" fill="#0b0b0b" font-family="Menlo, Consolas, monospace" font-weight="bold">MPI_Alltoallw</text>
  <rect x="150" y="270" width="47" height="30" rx="3" fill="#e3edfa" stroke="#2a78d6" stroke-width="1.5"/>
  <rect x="198" y="270" width="47" height="30" rx="3" fill="#e3edfa" stroke="#2a78d6" stroke-width="1.5"/>
  <rect x="246" y="270" width="95" height="30" rx="3" fill="#fbe9d6" stroke="#d97a1e" stroke-width="1.5"/>
  <rect x="342" y="270" width="11" height="30" rx="3" fill="#dcf0e3" stroke="#2f9a5b" stroke-width="1.5"/>
  <rect x="354" y="270" width="11" height="30" rx="3" fill="#dcf0e3" stroke="#2f9a5b" stroke-width="1.5"/>
  <rect x="366" y="270" width="11" height="30" rx="3" fill="#dcf0e3" stroke="#2f9a5b" stroke-width="1.5"/>
  <path d="M152,303 v4 H244 v-4" fill="none" stroke="#52514e" stroke-width="1.2"/>
  <text x="198.0" y="320" font-size="11.5" fill="#52514e" text-anchor="middle">→ 0</text>
  <path d="M248,303 v4 H340 v-4" fill="none" stroke="#52514e" stroke-width="1.2"/>
  <text x="294.0" y="320" font-size="11.5" fill="#52514e" text-anchor="middle">→ 1</text>
  <path d="M344,303 v4 H376 v-4" fill="none" stroke="#52514e" stroke-width="1.2"/>
  <text x="360.0" y="320" font-size="11.5" fill="#52514e" text-anchor="middle">→ 2</text>
  <text x="150" y="264" font-size="10.5" fill="#52514e" text-anchor="middle" font-family="Menlo, Consolas, monospace">0</text>
  <text x="198" y="264" font-size="10.5" fill="#52514e" text-anchor="middle" font-family="Menlo, Consolas, monospace">4</text>
  <text x="246" y="264" font-size="10.5" fill="#52514e" text-anchor="middle" font-family="Menlo, Consolas, monospace">8</text>
  <text x="294" y="264" font-size="10.5" fill="#52514e" text-anchor="middle" font-family="Menlo, Consolas, monospace">12</text>
  <text x="342" y="264" font-size="10.5" fill="#52514e" text-anchor="middle" font-family="Menlo, Consolas, monospace">16</text>
  <text x="140" y="264" font-size="10.5" fill="#52514e" text-anchor="end">byte</text>
  <text x="460" y="282" font-size="12" fill="#52514e">per-rank counts, types and displacements</text>
  <text x="460" y="300" font-size="12" fill="#52514e">(displacements in bytes):</text>
  <text x="460" y="318" font-size="11.5" fill="#52514e" font-family="Menlo, Consolas, monospace">sendcounts = {2, 1, 3}  sdispls = {0, 8, 16}</text>
  <text x="460" y="336" font-size="11.5" fill="#52514e" font-family="Menlo, Consolas, monospace">sendtypes = {MPI_INT, MPI_DOUBLE, MPI_CHAR}</text>
</svg>
