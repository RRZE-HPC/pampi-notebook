  <text x="40" y="530" font-size="12" fill="#52514e">In a non-periodic dimension, a neighbor beyond the boundary is MPI_PROC_NULL:</text>
  <text x="40" y="548" font-size="12" fill="#52514e">e.g. rank 4 in dim 1 with disp = 2 gets src = dst = MPI_PROC_NULL.</text>
  <text x="40" y="574" font-size="12" fill="#0b0b0b">Why "source" and "dest"? If every rank sends to dst and receives from src (MPI_Sendrecv), the data moves by disp along dim.</text>
