<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" width="860" height="460" font-family="Helvetica, Arial, sans-serif">
  <title>Four datapaths of a message from GPU memory of one process to GPU memory of another: staged through host memory with three transfers one after the other; pipelined staging in chunks, where the copies and the transfers of different chunks overlap; GPUDirect RDMA, where the network cards read and write GPU memory directly; GPUDirect peer-to-peer within a node, a single copy over NVLink or PCIe</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
  </defs>
  <rect width="860" height="460" rx="12" fill="#fcfcfb"/>
  <text x="24" y="38" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="bold">1  Staged</text>
  <text x="24" y="56" font-size="11" fill="#52514e" text-anchor="start">works with every MPI library</text>
  <rect x="245" y="22" width="104" height="38" rx="6" fill="#dcf0e3" stroke="#2f9a5b" stroke-width="1.5"/>
  <text x="297" y="45" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold">GPU memory</text>
  <line x1="352" y1="41" x2="404.667" y2="41" stroke="#52514e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="378.833" y="33" font-size="10.5" fill="#52514e" text-anchor="middle">copy</text>
  <rect x="408.6666666666667" y="22" width="104" height="38" rx="6" fill="#e3edfa" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="460.667" y="45" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold">host memory</text>
  <line x1="515.667" y1="41" x2="568.333" y2="41" stroke="#52514e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="542.5" y="33" font-size="10.5" fill="#52514e" text-anchor="middle">MPI</text>
  <rect x="572.3333333333334" y="22" width="104" height="38" rx="6" fill="#e3edfa" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="624.333" y="45" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold">host memory</text>
  <line x1="679.333" y1="41" x2="732" y2="41" stroke="#52514e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="706.167" y="33" font-size="10.5" fill="#52514e" text-anchor="middle">copy</text>
  <rect x="736.0" y="22" width="104" height="38" rx="6" fill="#dcf0e3" stroke="#2f9a5b" stroke-width="1.5"/>
  <text x="788" y="45" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold">GPU memory</text>
  <text x="245" y="81" font-size="11" fill="#52514e" text-anchor="start">three transfers one after the other, two of them over PCIe — the host waits for each one</text>
  <text x="24" y="128" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="bold">2  Pipelined staging</text>
  <text x="24" y="146" font-size="11" fill="#52514e" text-anchor="start">inside CUDA-aware MPI, or by hand</text>
  <text x="327" y="124.5" font-size="10.5" fill="#52514e" text-anchor="end">copy to host</text>
  <rect x="337" y="112" width="62" height="16" rx="3" fill="#e3edfa" stroke="#2a78d6" stroke-width="1.2"/>
  <text x="368" y="124" font-size="9.5" fill="#0b0b0b" text-anchor="middle">chunk 0</text>
  <rect x="403" y="112" width="62" height="16" rx="3" fill="#e3edfa" stroke="#2a78d6" stroke-width="1.2"/>
  <text x="434" y="124" font-size="9.5" fill="#0b0b0b" text-anchor="middle">chunk 1</text>
  <rect x="469" y="112" width="62" height="16" rx="3" fill="#e3edfa" stroke="#2a78d6" stroke-width="1.2"/>
  <text x="500" y="124" font-size="9.5" fill="#0b0b0b" text-anchor="middle">chunk 2</text>
  <rect x="535" y="112" width="62" height="16" rx="3" fill="#e3edfa" stroke="#2a78d6" stroke-width="1.2"/>
  <text x="566" y="124" font-size="9.5" fill="#0b0b0b" text-anchor="middle">chunk 3</text>
  <text x="327" y="144.5" font-size="10.5" fill="#52514e" text-anchor="end">MPI</text>
  <rect x="403" y="132" width="62" height="16" rx="3" fill="#dbf0f3" stroke="#2a9bb0" stroke-width="1.2"/>
  <text x="434" y="144" font-size="9.5" fill="#0b0b0b" text-anchor="middle">chunk 0</text>
  <rect x="469" y="132" width="62" height="16" rx="3" fill="#dbf0f3" stroke="#2a9bb0" stroke-width="1.2"/>
  <text x="500" y="144" font-size="9.5" fill="#0b0b0b" text-anchor="middle">chunk 1</text>
  <rect x="535" y="132" width="62" height="16" rx="3" fill="#dbf0f3" stroke="#2a9bb0" stroke-width="1.2"/>
  <text x="566" y="144" font-size="9.5" fill="#0b0b0b" text-anchor="middle">chunk 2</text>
  <rect x="601" y="132" width="62" height="16" rx="3" fill="#dbf0f3" stroke="#2a9bb0" stroke-width="1.2"/>
  <text x="632" y="144" font-size="9.5" fill="#0b0b0b" text-anchor="middle">chunk 3</text>
  <text x="327" y="164.5" font-size="10.5" fill="#52514e" text-anchor="end">copy to GPU</text>
  <rect x="469" y="152" width="62" height="16" rx="3" fill="#dcf0e3" stroke="#2f9a5b" stroke-width="1.2"/>
  <text x="500" y="164" font-size="9.5" fill="#0b0b0b" text-anchor="middle">chunk 0</text>
  <rect x="535" y="152" width="62" height="16" rx="3" fill="#dcf0e3" stroke="#2f9a5b" stroke-width="1.2"/>
  <text x="566" y="164" font-size="9.5" fill="#0b0b0b" text-anchor="middle">chunk 1</text>
  <rect x="601" y="152" width="62" height="16" rx="3" fill="#dcf0e3" stroke="#2f9a5b" stroke-width="1.2"/>
  <text x="632" y="164" font-size="9.5" fill="#0b0b0b" text-anchor="middle">chunk 2</text>
  <rect x="667" y="152" width="62" height="16" rx="3" fill="#dcf0e3" stroke="#2f9a5b" stroke-width="1.2"/>
  <text x="698" y="164" font-size="9.5" fill="#0b0b0b" text-anchor="middle">chunk 3</text>
  <text x="245" y="192" font-size="11" fill="#52514e" text-anchor="start">the stages of different chunks overlap: at best, the time of the slowest stage plus two chunks</text>
  <text x="24" y="238" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="bold">3  GPUDirect RDMA</text>
  <text x="24" y="256" font-size="11" fill="#52514e" text-anchor="start">CUDA-aware MPI, between nodes</text>
  <rect x="245" y="222" width="104" height="38" rx="6" fill="#dcf0e3" stroke="#2f9a5b" stroke-width="1.5"/>
  <text x="297" y="245" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold">GPU memory</text>
  <line x1="352" y1="241" x2="404.667" y2="241" stroke="#52514e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="378.833" y="233" font-size="10.5" fill="#52514e" text-anchor="middle">PCIe</text>
  <rect x="408.6666666666667" y="222" width="104" height="38" rx="6" fill="#fbe9d6" stroke="#d97a1e" stroke-width="1.5"/>
  <text x="460.667" y="245" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold">network card</text>
  <line x1="515.667" y1="241" x2="568.333" y2="241" stroke="#52514e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="542.5" y="233" font-size="10.5" fill="#52514e" text-anchor="middle">network</text>
  <rect x="572.3333333333334" y="222" width="104" height="38" rx="6" fill="#fbe9d6" stroke="#d97a1e" stroke-width="1.5"/>
  <text x="624.333" y="245" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold">network card</text>
  <line x1="679.333" y1="241" x2="732" y2="241" stroke="#52514e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="706.167" y="233" font-size="10.5" fill="#52514e" text-anchor="middle">PCIe</text>
  <rect x="736.0" y="222" width="104" height="38" rx="6" fill="#dcf0e3" stroke="#2f9a5b" stroke-width="1.5"/>
  <text x="788" y="245" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold">GPU memory</text>
  <text x="245" y="281" font-size="11" fill="#52514e" text-anchor="start">the network cards read and write GPU memory directly — the CPUs and host memory are not involved</text>
  <text x="24" y="334" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="bold">4  GPUDirect P2P, CUDA IPC</text>
  <text x="24" y="352" font-size="11" fill="#52514e" text-anchor="start">CUDA-aware MPI, within a node</text>
  <rect x="245" y="318" width="104" height="38" rx="6" fill="#dcf0e3" stroke="#2f9a5b" stroke-width="1.5"/>
  <text x="297" y="341" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold">GPU memory</text>
  <line x1="352" y1="337" x2="568.333" y2="337" stroke="#52514e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="460.667" y="329" font-size="10.5" fill="#52514e" text-anchor="middle">NVLink or PCIe</text>
  <rect x="572.3333333333333" y="318" width="104" height="38" rx="6" fill="#dcf0e3" stroke="#2f9a5b" stroke-width="1.5"/>
  <text x="624.333" y="341" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold">GPU memory</text>
  <text x="245" y="377" font-size="11" fill="#52514e" text-anchor="start">a single copy, done by a copy engine or a kernel of one of the GPUs</text>
  <rect x="245" y="420" width="14" height="14" rx="3" fill="#dcf0e3" stroke="#2f9a5b" stroke-width="1.2"/>
  <text x="265" y="431.5" font-size="11" fill="#52514e" text-anchor="start">GPU memory</text>
  <rect x="375" y="420" width="14" height="14" rx="3" fill="#e3edfa" stroke="#2a78d6" stroke-width="1.2"/>
  <text x="395" y="431.5" font-size="11" fill="#52514e" text-anchor="start">host memory</text>
  <rect x="505" y="420" width="14" height="14" rx="3" fill="#fbe9d6" stroke="#d97a1e" stroke-width="1.2"/>
  <text x="525" y="431.5" font-size="11" fill="#52514e" text-anchor="start">network card</text>
  <rect x="635" y="420" width="14" height="14" rx="3" fill="#dbf0f3" stroke="#2a9bb0" stroke-width="1.2"/>
  <text x="655" y="431.5" font-size="11" fill="#52514e" text-anchor="start">network</text>
</svg>
