<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" width="560" height="360" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97a1e"/>
    </marker>
  </defs>
  <rect width="560" height="360" rx="12" fill="#fcfcfb"/>

  <!-- neighbors -->
  <g fill="#e3edfa" stroke="#2a78d6" stroke-width="1.5">
    <rect x="200" y="15" width="160" height="60"/>
    <rect x="200" y="245" width="160" height="60"/>
    <rect x="35" y="110" width="120" height="100"/>
    <rect x="405" y="110" width="120" height="100"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#52514e">
    <text x="280" y="40">north</text><text x="280" y="290">south</text>
    <text x="95" y="165">west</text><text x="465" y="165">east</text>
  </g>

  <!-- own tile: halo, boundary rim, bulk -->
  <rect x="185" y="95" width="190" height="130" fill="#fbe9d6" stroke="#d97a1e" stroke-width="1.5" stroke-dasharray="6 3"/>
  <rect x="200" y="110" width="160" height="100" fill="#9cc0ec" stroke="#2a78d6" stroke-width="1.5"/>
  <rect x="214" y="124" width="132" height="72" fill="#e3edfa"/>
  <text x="280" y="157" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b0b0b">bulk</text>
  <text x="280" y="175" text-anchor="middle" font-size="12" fill="#52514e">needs no ghost cells</text>

  <!-- sends: own boundary to neighbor -->
  <g stroke="#2a78d6" stroke-width="2" marker-end="url(#arrb)">
    <line x1="262" y1="117" x2="262" y2="79"/>
    <line x1="262" y1="203" x2="262" y2="241"/>
    <line x1="207" y1="145" x2="159" y2="145"/>
    <line x1="353" y1="145" x2="401" y2="145"/>
  </g>
  <!-- receives: neighbor to own ghost cells -->
  <g stroke="#d97a1e" stroke-width="2" marker-end="url(#arro)">
    <line x1="298" y1="62" x2="298" y2="104"/>
    <line x1="298" y1="258" x2="298" y2="216"/>
    <line x1="142" y1="178" x2="194" y2="178"/>
    <line x1="418" y1="178" x2="366" y2="178"/>
  </g>

  <g font-size="12.5" fill="#0b0b0b">
    <line x1="35" y1="327" x2="65" y2="327" stroke="#2a78d6" stroke-width="2" marker-end="url(#arrb)"/>
    <text x="75" y="331"><tspan font-family="Menlo, Consolas, monospace" font-size="11.5">MPI_Isend()</tspan> × 4: own boundary cells → neighbor</text>
    <line x1="35" y1="347" x2="65" y2="347" stroke="#d97a1e" stroke-width="2" marker-end="url(#arro)"/>
    <text x="75" y="351"><tspan font-family="Menlo, Consolas, monospace" font-size="11.5">MPI_Irecv()</tspan> × 4: neighbor's boundary cells → own ghost cells</text>
  </g>
</svg>
