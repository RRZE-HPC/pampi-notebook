  <rect x="172" y="50" width="34" height="30" rx="3" fill="#dcf0e3" stroke="#2f9a5b" stroke-width="1.5"/>
  <text x="189.0" y="70.0" font-size="14" fill="#0b0b0b" text-anchor="middle">3</text>
  <rect x="208" y="50" width="34" height="30" rx="3" fill="#ece3f7" stroke="#8a5cc2" stroke-width="1.5"/>
  <text x="225.0" y="70.0" font-size="14" fill="#0b0b0b" text-anchor="middle">4</text>
  <rect x="250" y="56" width="40" height="18" rx="9" fill="#0b0b0b"/>
  <text x="270" y="69" font-size="11" fill="#fcfcfb" text-anchor="middle" font-weight="bold">root</text>
  <rect x="570" y="50" width="34" height="30" rx="3" fill="#e3edfa" stroke="#2a78d6" stroke-width="1.5"/>
