  <rect x="570" y="92" width="34" height="30" rx="3" fill="#fbe9d6" stroke="#d97a1e" stroke-width="1.5"/>
  <text x="587.0" y="112.0" font-size="14" fill="#0b0b0b" text-anchor="middle">2</text>
  <rect x="570" y="134" width="34" height="30" rx="3" fill="#dcf0e3" stroke="#2f9a5b" stroke-width="1.5"/>
  <text x="587.0" y="154.0" font-size="14" fill="#0b0b0b" text-anchor="middle">3</text>
  <rect x="570" y="176" width="34" height="30" rx="3" fill="#ece3f7" stroke="#8a5cc2" stroke-width="1.5"/>
