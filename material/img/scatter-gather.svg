<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 250" width="780" height="250" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
  </defs>
  <rect width="780" height="250" rx="12" fill="#fcfcfb"/>
  <text x="30" y="30" font-size="15" fill="#0b0b0b" font-weight="bold">buffer on the root</text>
  <text x="500" y="30" font-size="15" fill="#0b0b0b" font-weight="bold">one chunk per rank</text>
  <text x="30" y="70.0" font-size="13" fill="#52514e">rank 0</text>
  <text x="30" y="112.0" font-size="13" fill="#52514e">rank 1</text>
  <text x="30" y="154.0" font-size="13" fill="#52514e">rank 2</text>
  <text x="30" y="196.0" font-size="13" fill="#52514e">rank 3</text>
  <text x="500" y="70.0" font-size="13" fill="#52514e">rank 0</text>
  <text x="500" y="112.0" font-size="13" fill="#52514e">rank 1</text>
  <text x="500" y="154.0" font-size="13" fill="#52514e">rank 2</text>
  <text x="500" y="196.0" font-size="13" fill="#52514e">rank 3</text>
  <rect x="100" y="50" width="34" height="30" rx="3" fill="#e3edfa" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="117.0" y="70.0" font-size="14" fill="#0b0b0b" text-anchor="middle">1</text>
  <rect x="136" y="50" width="34" height="30" rx="3" fill="#fbe9d6" stroke="#d97a1e" stroke-width="1.5"/>
