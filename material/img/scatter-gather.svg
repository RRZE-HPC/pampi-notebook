  <text x="400.0" y="85" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-family="Menlo, Consolas, monospace">MPI_Scatter</text>
  <line x1="470" y1="150.8" x2="330" y2="150.8" stroke="#52514e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="400" y="141.8" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-family="Menlo, Consolas, monospace">MPI_Gather</text>
  <text x="390" y="222" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-family="Menlo, Consolas, monospace">MPI_Scatter(sendbuf, 1, MPI_INT, recvbuf, 1, MPI_INT, 0, MPI_COMM_WORLD)</text>
  <text x="390" y="240" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-family="Menlo, Consolas, monospace">MPI_Gather (sendbuf, 1, MPI_INT, recvbuf, 1, MPI_INT, 0, MPI_COMM_WORLD)</text>
