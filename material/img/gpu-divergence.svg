<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" width="860" height="280" font-family="Helvetica, Arial, sans-serif">
  <title>Branch divergence: when the threads of a warp take different paths, the warp executes both paths one after the other with the inactive lanes masked off; a CPU vectorizes the same branch with mask registers and also computes both sides; if whole warps take the same path, there is no extra cost</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
    <pattern id="stall" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#f7dcdc"/><line x1="0" y1="0" x2="0" y2="6" stroke="#c8373a" stroke-width="1.2" stroke-opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="860" height="280" rx="12" fill="#fcfcfb"/>
  <text x="20" y="26" font-size="12" fill="#0b0b0b" font-weight="bold" font-family="Menlo, Consolas, monospace">if (i % 2 == 0) A(); else B();</text>
  <text x="300" y="26" font-size="11" fill="#52514e">- one warp, 8 of 32 lanes shown</text>
  <text x="20" y="57" font-size="11" fill="#52514e" font-family="Menlo, Consolas, monospace">condition</text>
  <rect x="110" y="42" width="26" height="22" rx="3" fill="#f1f0ee" stroke="#a3a29c" stroke-width="1"/>
  <text x="123" y="57" font-size="10" fill="#0b0b0b" text-anchor="middle">0</text>
  <rect x="140" y="42" width="26" height="22" rx="3" fill="#f1f0ee" stroke="#a3a29c" stroke-width="1"/>
  <text x="153" y="57" font-size="10" fill="#0b0b0b" text-anchor="middle">1</text>
  <rect x="170" y="42" width="26" height="22" rx="3" fill="#f1f0ee" stroke="#a3a29c" stroke-width="1"/>
  <text x="183" y="57" font-size="10" fill="#0b0b0b" text-anchor="middle">2</text>
  <rect x="200" y="42" width="26" height="22" rx="3" fill="#f1f0ee" stroke="#a3a29c" stroke-width="1"/>
  <text x="213" y="57" font-size="10" fill="#0b0b0b" text-anchor="middle">3</text>
  <rect x="230" y="42" width="26" height="22" rx="3" fill="#f1f0ee" stroke="#a3a29c" stroke-width="1"/>
  <text x="243" y="57" font-size="10" fill="#0b0b0b" text-anchor="middle">4</text>
  <rect x="260" y="42" width="26" height="22" rx="3" fill="#f1f0ee" stroke="#a3a29c" stroke-width="1"/>
  <text x="273" y="57" font-size="10" fill="#0b0b0b" text-anchor="middle">5</text>
  <rect x="290" y="42" width="26" height="22" rx="3" fill="#f1f0ee" stroke="#a3a29c" stroke-width="1"/>
  <text x="303" y="57" font-size="10" fill="#0b0b0b" text-anchor="middle">6</text>
  <rect x="320" y="42" width="26" height="22" rx="3" fill="#f1f0ee" stroke="#a3a29c" stroke-width="1"/>
  <text x="333" y="57" font-size="10" fill="#0b0b0b" text-anchor="middle">7</text>
  <text x="20" y="87" font-size="11" fill="#52514e" font-family="Menlo, Consolas, monospace">A()</text>
  <rect x="110" y="72" width="26" height="22" rx="3" fill="#e3edfa" stroke="#2a78d6" stroke-width="1"/>
  <text x="123" y="87" font-size="10" fill="#0b0b0b" text-anchor="middle">0</text>
  <rect x="140" y="72" width="26" height="22" rx="3" fill="#fcfcfb" stroke="#a3a29c" stroke-width="0.8" stroke-dasharray="2 2"/>
  <rect x="170" y="72" width="26" height="22" rx="3" fill="#e3edfa" stroke="#2a78d6" stroke-width="1"/>
  <text x="183" y="87" font-size="10" fill="#0b0b0b" text-anchor="middle">2</text>
  <rect x="200" y="72" width="26" height="22" rx="3" fill="#fcfcfb" stroke="#a3a29c" stroke-width="0.8" stroke-dasharray="2 2"/>
  <rect x="230" y="72" width="26" height="22" rx="3" fill="#e3edfa" stroke="#2a78d6" stroke-width="1"/>
  <text x="243" y="87" font-size="10" fill="#0b0b0b" text-anchor="middle">4</text>
  <rect x="260" y="72" width="26" height="22" rx="3" fill="#fcfcfb" stroke="#a3a29c" stroke-width="0.8" stroke-dasharray="2 2"/>
  <rect x="290" y="72" width="26" height="22" rx="3" fill="#e3edfa" stroke="#2a78d6" stroke-width="1"/>
  <text x="303" y="87" font-size="10" fill="#0b0b0b" text-anchor="middle">6</text>
  <rect x="320" y="72" width="26" height="22" rx="3" fill="#fcfcfb" stroke="#a3a29c" stroke-width="0.8" stroke-dasharray="2 2"/>
  <text x="20" y="117" font-size="11" fill="#52514e" font-family="Menlo, Consolas, monospace">B()</text>
  <rect x="110" y="102" width="26" height="22" rx="3" fill="#fcfcfb" stroke="#a3a29c" stroke-width="0.8" stroke-dasharray="2 2"/>
  <rect x="140" y="102" width="26" height="22" rx="3" fill="#ece3f7" stroke="#8a5cc2" stroke-width="1"/>
  <text x="153" y="117" font-size="10" fill="#0b0b0b" text-anchor="middle">1</text>
  <rect x="170" y="102" width="26" height="22" rx="3" fill="#fcfcfb" stroke="#a3a29c" stroke-width="0.8" stroke-dasharray="2 2"/>
  <rect x="200" y="102" width="26" height="22" rx="3" fill="#ece3f7" stroke="#8a5cc2" stroke-width="1"/>
  <text x="213" y="117" font-size="10" fill="#0b0b0b" text-anchor="middle">3</text>
  <rect x="230" y="102" width="26" height="22" rx="3" fill="#fcfcfb" stroke="#a3a29c" stroke-width="0.8" stroke-dasharray="2 2"/>
  <rect x="260" y="102" width="26" height="22" rx="3" fill="#ece3f7" stroke="#8a5cc2" stroke-width="1"/>
  <text x="273" y="117" font-size="10" fill="#0b0b0b" text-anchor="middle">5</text>
  <rect x="290" y="102" width="26" height="22" rx="3" fill="#fcfcfb" stroke="#a3a29c" stroke-width="0.8" stroke-dasharray="2 2"/>
  <rect x="320" y="102" width="26" height="22" rx="3" fill="#ece3f7" stroke="#8a5cc2" stroke-width="1"/>
  <text x="333" y="117" font-size="10" fill="#0b0b0b" text-anchor="middle">7</text>
  <text x="20" y="147" font-size="11" fill="#52514e" font-family="Menlo, Consolas, monospace">converged</text>
  <rect x="110" y="132" width="26" height="22" rx="3" fill="#f1f0ee" stroke="#a3a29c" stroke-width="1"/>
  <text x="123" y="147" font-size="10" fill="#0b0b0b" text-anchor="middle">0</text>
  <rect x="140" y="132" width="26" height="22" rx="3" fill="#f1f0ee" stroke="#a3a29c" stroke-width="1"/>
  <text x="153" y="147" font-size="10" fill="#0b0b0b" text-anchor="middle">1</text>
  <rect x="170" y="132" width="26" height="22" rx="3" fill="#f1f0ee" stroke="#a3a29c" stroke-width="1"/>
  <text x="183" y="147" font-size="10" fill="#0b0b0b" text-anchor="middle">2</text>
  <rect x="200" y="132" width="26" height="22" rx="3" fill="#f1f0ee" stroke="#a3a29c" stroke-width="1"/>
  <text x="213" y="147" font-size="10" fill="#0b0b0b" text-anchor="middle">3</text>
  <rect x="230" y="132" width="26" height="22" rx="3" fill="#f1f0ee" stroke="#a3a29c" stroke-width="1"/>
  <text x="243" y="147" font-size="10" fill="#0b0b0b" text-anchor="middle">4</text>
  <rect x="260" y="132" width="26" height="22" rx="3" fill="#f1f0ee" stroke="#a3a29c" stroke-width="1"/>
  <text x="273" y="147" font-size="10" fill="#0b0b0b" text-anchor="middle">5</text>
  <rect x="290" y="132" width="26" height="22" rx="3" fill="#f1f0ee" stroke="#a3a29c" stroke-width="1"/>
  <text x="303" y="147" font-size="10" fill="#0b0b0b" text-anchor="middle">6</text>
  <rect x="320" y="132" width="26" height="22" rx="3" fill="#f1f0ee" stroke="#a3a29c" stroke-width="1"/>
  <text x="333" y="147" font-size="10" fill="#0b0b0b" text-anchor="middle">7</text>
  <line x1="360" y1="42" x2="360" y2="156" stroke="#52514e" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="368" y="104" font-size="10.5" fill="#52514e">time</text>
  <text x="20" y="182" font-size="11" fill="#0b0b0b">divergent warp: A and B one after the other,</text>
  <text x="20" y="197" font-size="11" fill="#0b0b0b">half of the lanes idle in each - cost A + B</text>
  <text x="470" y="26" font-size="12" fill="#0b0b0b" font-weight="bold" font-family="Menlo, Consolas, monospace">if ((i / 32) % 2 == 0) A(); else B();</text>
  <text x="470" y="57" font-size="11" fill="#52514e" font-family="Menlo, Consolas, monospace">warp 0: A()</text>
  <rect x="570" y="42" width="26" height="22" rx="3" fill="#e3edfa" stroke="#2a78d6" stroke-width="1"/>
  <rect x="600" y="42" width="26" height="22" rx="3" fill="#e3edfa" stroke="#2a78d6" stroke-width="1"/>
  <rect x="630" y="42" width="26" height="22" rx="3" fill="#e3edfa" stroke="#2a78d6" stroke-width="1"/>
  <rect x="660" y="42" width="26" height="22" rx="3" fill="#e3edfa" stroke="#2a78d6" stroke-width="1"/>
  <rect x="690" y="42" width="26" height="22" rx="3" fill="#e3edfa" stroke="#2a78d6" stroke-width="1"/>
  <rect x="720" y="42" width="26" height="22" rx="3" fill="#e3edfa" stroke="#2a78d6" stroke-width="1"/>
  <rect x="750" y="42" width="26" height="22" rx="3" fill="#e3edfa" stroke="#2a78d6" stroke-width="1"/>
  <rect x="780" y="42" width="26" height="22" rx="3" fill="#e3edfa" stroke="#2a78d6" stroke-width="1"/>
  <text x="470" y="87" font-size="11" fill="#52514e" font-family="Menlo, Consolas, monospace">warp 1: B()</text>
  <rect x="570" y="72" width="26" height="22" rx="3" fill="#ece3f7" stroke="#8a5cc2" stroke-width="1"/>
  <rect x="600" y="72" width="26" height="22" rx="3" fill="#ece3f7" stroke="#8a5cc2" stroke-width="1"/>
  <rect x="630" y="72" width="26" height="22" rx="3" fill="#ece3f7" stroke="#8a5cc2" stroke-width="1"/>
  <rect x="660" y="72" width="26" height="22" rx="3" fill="#ece3f7" stroke="#8a5cc2" stroke-width="1"/>
  <rect x="690" y="72" width="26" height="22" rx="3" fill="#ece3f7" stroke="#8a5cc2" stroke-width="1"/>
  <rect x="720" y="72" width="26" height="22" rx="3" fill="#ece3f7" stroke="#8a5cc2" stroke-width="1"/>
  <rect x="750" y="72" width="26" height="22" rx="3" fill="#ece3f7" stroke="#8a5cc2" stroke-width="1"/>
  <rect x="780" y="72" width="26" height="22" rx="3" fill="#ece3f7" stroke="#8a5cc2" stroke-width="1"/>
  <text x="470" y="128" font-size="11" fill="#0b0b0b">every warp takes one path with all lanes active:</text>
  <text x="470" y="143" font-size="11" fill="#0b0b0b">no divergence, warps 0 and 1 run concurrently</text>
  <rect x="20" y="214" width="820" height="52" rx="6" fill="#f1f0ee" stroke="#a3a29c" stroke-width="1.2"/>
  <text x="34" y="234" font-size="11" fill="#0b0b0b" font-weight="bold">CPU with SIMD:</text>
  <text x="130" y="234" font-size="11" fill="#0b0b0b">a vectorized branch also computes A and B for all lanes and blends the results with a mask register</text>
  <text x="130" y="252" font-size="11" fill="#52514e">(AVX-512: k0 ... k7) - the GPU does the masking in hardware, the CPU compiler has to generate it.</text>
</svg>
