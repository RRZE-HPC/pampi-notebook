<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" width="620" height="400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0b0b0b"/>
    </marker>
    <pattern id="wait" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#fcfcfb"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#e4e3df" stroke-width="3"/>
    </pattern>
  </defs>
  <rect width="620" height="400" rx="12" fill="#fcfcfb"/>

  <rect x="20" y="15" width="285" height="345" rx="10" fill="#f1f0ee"/>
  <rect x="315" y="15" width="285" height="345" rx="10" fill="#f1f0ee"/>
  <text x="162" y="38" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b0b0b">rank 0</text>
  <text x="457" y="38" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b0b0b">rank 1</text>

  <!-- lifelines -->
  <g stroke="#a3a29c" stroke-width="2">
    <line x1="100" y1="74" x2="100" y2="345"/>
    <line x1="230" y1="74" x2="230" y2="345"/>
    <line x1="390" y1="74" x2="390" y2="345"/>
    <line x1="520" y1="74" x2="520" y2="345"/>
  </g>
  <g font-size="14" text-anchor="middle" fill="#0b0b0b">
    <rect x="65" y="50" width="70" height="26" rx="5" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="1.5"/><text x="100" y="68">app</text>
    <rect x="195" y="50" width="70" height="26" rx="5" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="1.5"/><text x="230" y="68">MPI</text>
    <rect x="355" y="50" width="70" height="26" rx="5" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="1.5"/><text x="390" y="68">MPI</text>
    <rect x="485" y="50" width="70" height="26" rx="5" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="1.5"/><text x="520" y="68">app</text>
  </g>

  <!-- rank 0 MPI activity -->
  <g font-size="12" text-anchor="middle" fill="#0b0b0b">
    <rect x="185" y="96" width="90" height="24" fill="#e3edfa" stroke="#2a78d6" stroke-width="1.5"/><text x="230" y="112">start send</text>
    <rect x="185" y="120" width="90" height="125" fill="url(#wait)" stroke="#a3a29c" stroke-width="1.5"/><text x="230" y="180" fill="#52514e">wait for</text><text x="230" y="195" fill="#52514e">receiver</text>
    <rect x="185" y="245" width="90" height="44" fill="#e3edfa" stroke="#2a78d6" stroke-width="1.5"/><text x="230" y="263">message</text><text x="230" y="278">transfer</text>
  </g>
  <!-- rank 1 MPI activity -->
  <g font-size="12" text-anchor="middle" fill="#0b0b0b">
    <rect x="345" y="210" width="90" height="35" fill="#fbe9d6" stroke="#d97a1e" stroke-width="1.5"/><text x="390" y="232">post receive</text>
    <rect x="345" y="245" width="90" height="44" fill="#fbe9d6" stroke="#d97a1e" stroke-width="1.5"/><text x="390" y="263">message</text><text x="390" y="278">transfer</text>
  </g>

  <!-- useful work on rank 0 -->
  <rect x="91" y="132" width="18" height="106" fill="#2f9a5b"/>
  <text x="80" y="185" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f9a5b" transform="rotate(-90 80 185)">useful work</text>

  <!-- calls and returns -->
  <g stroke="#0b0b0b" stroke-width="1.5" marker-end="url(#arr)">
    <line x1="100" y1="104" x2="183" y2="104"/>
    <line x1="185" y1="126" x2="102" y2="126"/>
    <line x1="100" y1="252" x2="183" y2="252"/>
    <line x1="185" y1="300" x2="102" y2="300"/>
    <line x1="520" y1="220" x2="437" y2="220"/>
    <line x1="435" y1="300" x2="518" y2="300"/>
  </g>
  <line x1="275" y1="267" x2="343" y2="267" stroke="#2a78d6" stroke-width="2.5" marker-end="url(#arr)"/>
  <g font-size="12" fill="#0b0b0b">
    <text x="112" y="99" font-family="Menlo, Consolas, monospace">MPI_Isend</text>
    <text x="118" y="141" fill="#52514e">request</text>
    <text x="112" y="247" font-family="Menlo, Consolas, monospace">MPI_Wait</text>
    <text x="112" y="316" fill="#52514e">completion</text>
    <text x="508" y="214" text-anchor="end" font-family="Menlo, Consolas, monospace">MPI_Recv</text>
    <text x="508" y="316" text-anchor="end" fill="#52514e">returns</text>
  </g>

  <text x="310" y="388" text-anchor="middle" font-size="13" fill="#52514e">best case: rank 0 does useful work while its message waits for the receiver — time runs downwards</text>
</svg>
