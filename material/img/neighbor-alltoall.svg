  <text x="590" y="114" font-size="11" fill="#52514e" text-anchor="middle" font-family="Menlo, Consolas, monospace">MPI_PROC_NULL</text>
  <line x1="590" y1="125" x2="590.0" y2="163.0" stroke="#a3a29c" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrg)"/>
  <text x="420" y="330" font-size="12.5" fill="#0b0b0b" font-weight="bold">recvbuf of rank 8</text>
  <rect x="420" y="340" width="78" height="34" rx="3" fill="#e3edfa" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="459.0" y="362.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-family="Menlo, Consolas, monospace">5→8</text>
