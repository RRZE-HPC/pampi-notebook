  <line x1="40" y1="414" x2="740" y2="414" stroke="#e4e3df" stroke-width="1"/>
  <text x="40" y="438" font-size="12" fill="#0b0b0b">MPI_Neighbor_alltoallv/w cut sendbuf and recvbuf into the blocks with counts, displacements (and types), like MPI_Alltoallv/w.</text>
</svg>
