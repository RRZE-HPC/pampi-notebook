  <text x="708" y="229.0" font-size="10.5" fill="#2a78d6" text-anchor="middle">its block 0</text>
  <line x1="664.0" y1="190.0" x2="634.0" y2="190.0" stroke="#2a78d6" stroke-width="1.8" marker-end="url(#arrb)"/>
  <rect x="548.0" y="245.0" width="84" height="50" rx="4" fill="#fbe9d6" stroke="#d97a1e" stroke-width="1.5"/>
  <text x="590" y="262" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="bold">rank 7</text>
  <rect x="573.2" y="271" width="33.6" height="18" rx="3" fill="#fcfcfb" stroke="#d97a1e" stroke-width="1.2"/>
  <text x="590" y="284" font-size="11" fill="#0b0b0b" text-anchor="middle" font-family="Menlo, Consolas, monospace">7→8</text>
  <text x="590" y="309.0" font-size="10.5" fill="#d97a1e" text-anchor="middle">its block 3</text>
  <line x1="590.0" y1="243.0" x2="590.0" y2="217.0" stroke="#d97a1e" stroke-width="1.8" marker-end="url(#arro)"/>
