<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97a1e"/></marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a3a29c"/></marker>
    <marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a5cc2"/></marker>
    <pattern id="pad" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fcfcfb"/><line x1="0" y1="0" x2="0" y2="6" stroke="#e4e3df" stroke-width="3"/></pattern>
  </defs>
  <rect width="780" height="470" rx="12" fill="#fcfcfb"/>
  <text x="40" y="32" font-size="13.5" fill="#0b0b0b" font-weight="bold" font-family="Menlo, Consolas, monospace">MPI_Neighbor_alltoall</text>
  <text x="228" y="32" font-size="12.5" fill="#52514e">a different block for every neighbor (block a→b: from rank a to rank b)</text>
  <text x="40" y="64" font-size="12.5" fill="#0b0b0b" font-weight="bold">send: block i goes to neighbor i</text>
  <text x="420" y="64" font-size="12.5" fill="#0b0b0b" font-weight="bold">receive: the block from neighbor i lands in slot i</text>
  <line x1="400" y1="50" x2="400" y2="400" stroke="#e4e3df" stroke-width="1"/>
  <rect x="163.0" y="165.0" width="84" height="50" rx="4" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="2.2"/>
  <text x="205" y="182" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="bold">rank 8 (me)</text>
  <rect x="170.2" y="191" width="69.6" height="18" rx="3" fill="#f1f0ee" stroke="#52514e" stroke-width="1.2"/>
  <text x="205" y="204" font-size="11" fill="#0b0b0b" text-anchor="middle" font-family="Menlo, Consolas, monospace">4 blocks</text>
  <rect x="45.0" y="165.0" width="84" height="50" rx="4" fill="#e3edfa" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="87" y="182" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="bold">rank 5</text>
  <rect x="70.2" y="191" width="33.6" height="18" rx="3" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.2"/>
  <text x="87" y="204" font-size="11" fill="#0b0b0b" text-anchor="middle" font-family="Menlo, Consolas, monospace">8→5</text>
  <text x="87" y="229.0" font-size="10.5" fill="#2a78d6" text-anchor="middle">stores it in slot 1</text>
  <line x1="161.0" y1="190.0" x2="131.0" y2="190.0" stroke="#2a78d6" stroke-width="1.8" marker-end="url(#arrb)"/>
  <rect x="281.0" y="165.0" width="84" height="50" rx="4" fill="#e3edfa" stroke="#2a78d6" stroke-width="1.5"/>
