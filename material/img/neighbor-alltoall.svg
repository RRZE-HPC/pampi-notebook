  <text x="161.0" y="389" font-size="10.5" fill="#52514e" text-anchor="middle">1: dim 0 +</text>
  <rect x="204" y="340" width="78" height="34" rx="3" fill="#fbe9d6" stroke="#d97a1e" stroke-width="1.5"/>
  <text x="243.0" y="362.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-family="Menlo, Consolas, monospace">8→7</text>
  <text x="243.0" y="389" font-size="10.5" fill="#52514e" text-anchor="middle">2: dim 1 −</text>
