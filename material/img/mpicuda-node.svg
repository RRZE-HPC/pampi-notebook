  <rect x="110" y="360" width="420" height="26" rx="5" fill="#ece3f7" stroke="#8a5cc2" stroke-width="1.5"/>
  <text x="320" y="377" font-size="11" fill="#0b0b0b" text-anchor="middle">NVLink / NVSwitch: 900 GB/s per direction and GPU</text>
  <rect x="650" y="20" width="190" height="382" rx="10" fill="#f1f0ee" stroke="#a3a29c" stroke-width="1.5"/>
  <text x="664" y="40" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="bold">node B</text>
  <line x1="745" y1="89" x2="745" y2="135" stroke="#52514e" stroke-width="2"/>
  <rect x="665" y="55" width="160" height="34" rx="6" fill="#fcfcfb" stroke="#a3a29c" stroke-width="1.5"/>
  <text x="745.0" y="76.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold">host memory</text>
  <rect x="665" y="135" width="160" height="44" rx="6" fill="#e3edfa" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="745.0" y="155.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold">CPU socket 0</text>
  <text x="745.0" y="170.0" font-size="10.5" fill="#52514e" text-anchor="middle">cores</text>
  <line x1="745" y1="179" x2="745" y2="215" stroke="#52514e" stroke-width="2"/>
  <rect x="665" y="215" width="160" height="28" rx="5" fill="#fcfcfb" stroke="#52514e" stroke-width="1.2"/>
  <text x="745" y="233" font-size="11" fill="#0b0b0b" text-anchor="middle">PCIe switch</text>
  <line x1="697.5" y1="243" x2="697.5" y2="280" stroke="#52514e" stroke-width="2"/>
  <line x1="785" y1="243" x2="785" y2="280" stroke="#52514e" stroke-width="2"/>
  <rect x="665" y="280" width="65" height="60" rx="6" fill="#fbe9d6" stroke="#d97a1e" stroke-width="1.5"/>
  <text x="697.5" y="314.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold">NIC</text>
  <rect x="745" y="280" width="80" height="60" rx="6" fill="#dcf0e3" stroke="#2f9a5b" stroke-width="1.5"/>
  <text x="785.0" y="308.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold">GPU</text>
  <text x="785.0" y="323.0" font-size="10.5" fill="#52514e" text-anchor="middle">HBM 8 TB/s</text>
  <text x="745" y="365" font-size="14" fill="#52514e" text-anchor="middle">…</text>
  <line x1="70.0" y1="340" x2="70.0" y2="420" stroke="#2a9bb0" stroke-width="2.5"/>
  <line x1="570.0" y1="340" x2="570.0" y2="420" stroke="#2a9bb0" stroke-width="2.5"/>
  <line x1="697.5" y1="340" x2="697.5" y2="420" stroke="#2a9bb0" stroke-width="2.5"/>
  <rect x="40" y="420" width="800" height="30" rx="6" fill="#dbf0f3" stroke="#2a9bb0" stroke-width="1.5"/>
  <text x="440" y="440" font-size="11.5" fill="#0b0b0b" text-anchor="middle">network, e.g. InfiniBand NDR: 400 Gbit/s = 50 GB/s per direction and network card</text>
