  <text x="320" y="172" font-size="10.5" fill="#52514e" text-anchor="middle">(xGMI, UPI)</text>
  <line x1="115" y1="179" x2="115" y2="215" stroke="#52514e" stroke-width="2"/>
  <rect x="40" y="215" width="230" height="28" rx="5" fill="#fcfcfb" stroke="#52514e" stroke-width="1.2"/>
  <text x="155" y="233" font-size="11" fill="#0b0b0b" text-anchor="middle">PCIe switch</text>
  <line x1="70.0" y1="243" x2="70.0" y2="280" stroke="#52514e" stroke-width="2"/>
  <rect x="40" y="280" width="60" height="60" rx="6" fill="#fbe9d6" stroke="#d97a1e" stroke-width="1.5"/>
  <text x="70.0" y="314.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold">NIC 0</text>
  <line x1="147.5" y1="243" x2="147.5" y2="280" stroke="#52514e" stroke-width="2"/>
  <rect x="110" y="280" width="75" height="60" rx="6" fill="#dcf0e3" stroke="#2f9a5b" stroke-width="1.5"/>
