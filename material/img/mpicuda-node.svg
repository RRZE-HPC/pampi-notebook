  <text x="407.5" y="308.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold">GPU 2</text>
  <text x="407.5" y="323.0" font-size="10.5" fill="#52514e" text-anchor="middle">HBM 8 TB/s</text>
  <line x1="492.5" y1="243" x2="492.5" y2="280" stroke="#52514e" stroke-width="2"/>
  <rect x="455" y="280" width="75" height="60" rx="6" fill="#dcf0e3" stroke="#2f9a5b" stroke-width="1.5"/>
  <text x="492.5" y="308.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold">GPU 3</text>
  <text x="492.5" y="323.0" font-size="10.5" fill="#52514e" text-anchor="middle">HBM 8 TB/s</text>
  <line x1="570.0" y1="243" x2="570.0" y2="280" stroke="#52514e" stroke-width="2"/>
  <rect x="540" y="280" width="60" height="60" rx="6" fill="#fbe9d6" stroke="#d97a1e" stroke-width="1.5"/>
  <text x="570.0" y="314.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold">NIC 1</text>
  <text x="123" y="200" font-size="10.5" fill="#52514e" text-anchor="start">PCIe 5.0 x16</text>
  <text x="517" y="200" font-size="10.5" fill="#52514e" text-anchor="end">PCIe 5.0 x16</text>
  <line x1="147.5" y1="340" x2="147.5" y2="360" stroke="#8a5cc2" stroke-width="2.5"/>
  <line x1="232.5" y1="340" x2="232.5" y2="360" stroke="#8a5cc2" stroke-width="2.5"/>
