  <text x="147.5" y="323.0" font-size="10.5" fill="#52514e" text-anchor="middle">HBM 8 TB/s</text>
  <line x1="232.5" y1="243" x2="232.5" y2="280" stroke="#52514e" stroke-width="2"/>
  <rect x="195" y="280" width="75" height="60" rx="6" fill="#dcf0e3" stroke="#2f9a5b" stroke-width="1.5"/>
  <text x="232.5" y="308.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold">GPU 1</text>
  <text x="232.5" y="323.0" font-size="10.5" fill="#52514e" text-anchor="middle">HBM 8 TB/s</text>
  <line x1="525" y1="179" x2="525" y2="215" stroke="#52514e" stroke-width="2"/>
  <rect x="370" y="215" width="230" height="28" rx="5" fill="#fcfcfb" stroke="#52514e" stroke-width="1.2"/>
  <text x="485" y="233" font-size="11" fill="#0b0b0b" text-anchor="middle">PCIe switch</text>
  <line x1="407.5" y1="243" x2="407.5" y2="280" stroke="#52514e" stroke-width="2"/>
