<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" font-family="Helvetica, Arial, sans-serif">
  <title>A GPU node with two CPU sockets, each with its own memory and a PCIe switch that connects two GPUs and one network card; the four GPUs are connected by NVLink; the network cards of all nodes are connected by the network</title>
  <rect width="860" height="470" rx="12" fill="#fcfcfb"/>
  <rect x="20" y="20" width="600" height="382" rx="10" fill="#f1f0ee" stroke="#a3a29c" stroke-width="1.5"/>
  <text x="34" y="40" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="bold">node A</text>
  <line x1="115" y1="89" x2="115" y2="135" stroke="#52514e" stroke-width="2"/>
  <rect x="40" y="55" width="150" height="34" rx="6" fill="#fcfcfb" stroke="#a3a29c" stroke-width="1.5"/>
  <text x="115.0" y="76.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold">host memory</text>
  <rect x="40" y="135" width="150" height="44" rx="6" fill="#e3edfa" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="115.0" y="155.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold">CPU socket 0</text>
  <text x="115.0" y="170.0" font-size="10.5" fill="#52514e" text-anchor="middle">cores</text>
  <line x1="525" y1="89" x2="525" y2="135" stroke="#52514e" stroke-width="2"/>
  <rect x="450" y="55" width="150" height="34" rx="6" fill="#fcfcfb" stroke="#a3a29c" stroke-width="1.5"/>
  <text x="525.0" y="76.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold">host memory</text>
  <rect x="450" y="135" width="150" height="44" rx="6" fill="#e3edfa" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="525.0" y="155.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="bold">CPU socket 1</text>
  <text x="525.0" y="170.0" font-size="10.5" fill="#52514e" text-anchor="middle">cores</text>
  <text x="123" y="117" font-size="10.5" fill="#52514e" text-anchor="start">DDR5 ≈ 600 GB/s</text>
  <line x1="190" y1="157" x2="450" y2="157" stroke="#52514e" stroke-width="3"/>
