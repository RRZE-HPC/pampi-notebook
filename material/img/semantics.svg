<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" width="780" height="360" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c8373a"/>
    </marker>
  </defs>
  <rect width="780" height="360" rx="12" fill="#fcfcfb"/>

  <!-- ===== order ===== -->
  <text x="30" y="34" font-size="15" fill="#0b0b0b"><tspan font-weight="bold">Order:</tspan> messages are non-overtaking</text>
  <rect x="30" y="50" width="180" height="100" rx="8" fill="#f1f0ee" stroke="#a3a29c" stroke-width="1.5"/>
  <text x="200" y="68" text-anchor="end" font-size="13" font-weight="bold" fill="#0b0b0b">rank 0</text>
  <rect x="330" y="50" width="180" height="100" rx="8" fill="#f1f0ee" stroke="#a3a29c" stroke-width="1.5"/>
  <text x="500" y="68" text-anchor="end" font-size="13" font-weight="bold" fill="#0b0b0b">rank 1</text>
  <g font-size="13" fill="#0b0b0b" text-anchor="middle">
    <rect x="45" y="78" width="95" height="26" rx="5" fill="#e3edfa" stroke="#2a78d6" stroke-width="1.5"/><text x="92" y="96">send #1</text>
    <rect x="45" y="114" width="95" height="26" rx="5" fill="#e3edfa" stroke="#2a78d6" stroke-width="1.5"/><text x="92" y="132">send #2</text>
    <rect x="345" y="78" width="110" height="26" rx="5" fill="#fbe9d6" stroke="#d97a1e" stroke-width="1.5"/><text x="400" y="96">1st receive</text>
    <rect x="345" y="114" width="110" height="26" rx="5" fill="#fbe9d6" stroke="#d97a1e" stroke-width="1.5"/><text x="400" y="132">2nd receive</text>
  </g>
  <line x1="141" y1="91" x2="342" y2="91" stroke="#2a78d6" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="141" y1="127" x2="342" y2="127" stroke="#2a78d6" stroke-width="2" marker-end="url(#arr)"/>
  <g font-size="13" fill="#0b0b0b">
    <text x="535" y="74">If both messages match the first</text>
    <text x="535" y="92">receive, it gets #1. Send #2 cannot</text>
    <text x="535" y="110">overtake send #1 — this only holds</text>
    <text x="535" y="128">for the same sender, receiver and</text>
    <text x="535" y="146">communicator.</text>
  </g>

  <!-- ===== fairness ===== -->
  <text x="30" y="194" font-size="15" fill="#0b0b0b"><tspan font-weight="bold">Fairness:</tspan> there is no guarantee</text>
  <g font-size="13" fill="#0b0b0b">
    <rect x="30" y="210" width="180" height="38" rx="8" fill="#f1f0ee" stroke="#a3a29c" stroke-width="1.5"/>
    <rect x="100" y="216" width="95" height="26" rx="5" fill="#e3edfa" stroke="#2a78d6" stroke-width="1.5"/>
    <text x="147" y="234" text-anchor="middle">send #1</text><text x="42" y="234" font-weight="bold">rank 0</text>
    <rect x="30" y="256" width="180" height="38" rx="8" fill="#f1f0ee" stroke="#a3a29c" stroke-width="1.5"/>
    <rect x="100" y="262" width="95" height="26" rx="5" fill="#e3edfa" stroke="#2a78d6" stroke-width="1.5"/>
    <text x="147" y="280" text-anchor="middle">send #2</text><text x="42" y="280" font-weight="bold">rank 1</text>
    <rect x="30" y="302" width="180" height="38" rx="8" fill="#f1f0ee" stroke="#a3a29c" stroke-width="1.5"/>
    <rect x="100" y="308" width="95" height="26" rx="5" fill="#e3edfa" stroke="#2a78d6" stroke-width="1.5"/>
    <text x="147" y="326" text-anchor="middle">send #3</text><text x="42" y="326" font-weight="bold">rank 2</text>
  </g>
  <rect x="330" y="210" width="180" height="130" rx="8" fill="#f1f0ee" stroke="#a3a29c" stroke-width="1.5"/>
  <text x="500" y="228" text-anchor="end" font-size="13" font-weight="bold" fill="#0b0b0b">rank 3</text>
  <g font-size="13" fill="#0b0b0b" text-anchor="middle">
    <rect x="345" y="252" width="110" height="26" rx="5" fill="#fbe9d6" stroke="#d97a1e" stroke-width="1.5"/><text x="400" y="270">receive</text>
    <rect x="345" y="290" width="110" height="26" rx="5" fill="#fbe9d6" stroke="#d97a1e" stroke-width="1.5"/><text x="400" y="308">receive</text>
  </g>
  <text x="420" y="334" text-anchor="middle" font-size="11" fill="#52514e" font-family="Menlo, Consolas, monospace">MPI_ANY_SOURCE</text>
  <path d="M196,229 C230,229 260,240 342,262" fill="none" stroke="#c8373a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrg)"/>
  <path d="M196,275 C230,275 260,270 342,266" fill="none" stroke="#2a78d6" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M196,321 C230,321 260,310 342,303" fill="none" stroke="#2a78d6" stroke-width="2" marker-end="url(#arr)"/>
  <g font-size="13" fill="#0b0b0b">
    <text x="535" y="236">Rank 3 receives with</text>
    <text x="535" y="254"><tspan font-family="Menlo, Consolas, monospace" font-size="12">MPI_ANY_SOURCE</tspan> in a loop.</text>
    <text x="535" y="272">MPI may keep matching the messages</text>
    <text x="535" y="290">of ranks 1 and 2 —</text>
    <text x="535" y="308" fill="#c8373a">send #1 may starve and</text>
    <text x="535" y="326" fill="#c8373a">never be received.</text>
  </g>
</svg>
